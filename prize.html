<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#743f2b">
<title>景品交換｜東海道川崎宿 クイズラリー</title>
<style>
:root{--brown:#743f2b;--cream:#faf5ec;--ink:#2f2925;--green:#356b45;--muted:#70665f;--line:#e8ddd1}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.7}
header{padding:30px 18px;background:var(--brown);color:white;text-align:center}
h1{font-size:clamp(25px,6vw,34px);margin:6px 0;line-height:1.4}
main{width:min(680px,100%);margin:auto;padding:16px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 4px 16px #43271908}
h2{font-size:21px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;width:100%;border:0;border-radius:10px;padding:13px 14px;margin-top:10px;background:var(--brown);color:white;font-weight:700;cursor:pointer}
.notice{background:#f0f6ef;border:1px solid #cbdcc9;border-radius:12px;padding:14px;margin:16px 0}
.hidden{display:none!important}
footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>🎁 景品交換ページ</h1><div>東海道川崎宿 クイズラリー</div></header>
<main>
  <section id="eligible" class="panel hidden">
    <h2>3問クリアおめでとうございます！</h2>
    <p id="countText">クイズを3問以上クリアしました。</p>
    <div class="notice"><strong>景品交換の方法</strong><br>この画面を景品交換所のスタッフに提示してください。<br><span class="muted">※ 実際の交換場所・受付時間・景品の内容は、主催者が案内を追記してください。</span></div>
    <p class="muted">この画面は、同じ端末・同じブラウザに保存されたクリア状況を確認しています。</p>
    <button id="backButton">クイズラリーに戻る</button>
  </section>
  <section id="locked" class="panel hidden">
    <h2>あと少しです！</h2>
    <p id="lockedText">景品交換ページを開くには、3問以上のクイズに正解してください。</p>
    <button id="returnButton">クイズラリーに戻る</button>
  </section>
</main>
<footer>東海道川崎宿 クイズラリー</footer>
<script>
const KEY="kawasakiQuizCompleted";
let completed=[];
try {
  const stored=JSON.parse(localStorage.getItem(KEY)||"[]");
  if(Array.isArray(stored)) completed=stored.filter(id=>Number.isInteger(id)&&id>=1&&id<=6);
} catch(e) {}
const allowed=completed.length>=3;
document.getElementById("eligible").classList.toggle("hidden",!allowed);
document.getElementById("locked").classList.toggle("hidden",allowed);
document.getElementById("countText").textContent=`クリア済み：${completed.length}問。スタッフにこの画面を提示してください。`;
document.getElementById("lockedText").textContent=`現在は${completed.length}問クリアしています。あと${Math.max(0,3-completed.length)}問正解すると景品交換ページへ進めます。`;
function goBack(){window.location.href="index.html";}
document.getElementById("backButton").addEventListener("click",goBack);
document.getElementById("returnButton").addEventListener("click",goBack);
</script>
</body>
</html>
